name: biaxis_r2_scale

# Bi-Axis R2-Design-2.0 — scale model (m2)
# Factor-specific propagation horizon (docs/BiAxis_R2_Design_2_0_*.md).
# M0 = exact B0 1-hop; M1 = H1 + alpha*(H2-H1); M2 = 0/1/2-hop softmax
# mixture. Parent = frozen B0 (b0_confirm checkpoints).

hidden_dim: 256
factor_dim: 128
dropout: 0.2
activation: gelu
norm: layernorm

# P0 aux weights — copied verbatim from biaxis_final.yaml (audit §A2).
lambda_common: 0.02
lambda_orth: 0.01
lambda_recon: 0.3
orth_fallback_batch: 16

full_graph_training: true

# R2-Design-2.0 scale mode: m0 | m1 | m2.
scale_mode: m2

# Unified NC protocol (A0 optimizer, plan §21).
lr: 0.001
weight_decay: 0.0001

# neighbor_mean edge chunking (audited P1 aggregation; 500k > any E in the
# NC suite, so the unchunked single-gather path is used in practice).
edge_chunk_size: 500000

semantic_refiner:
  enabled: false
  gate_hidden: 64
  dropout: 0.2

functional_transfer:
  enabled: false
  type_dim: 8
  gate_hidden: 64
  rho_func_init: 0.01
