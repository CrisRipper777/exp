name: biaxis_final

# =========================================================================
# Bi-Axis MAG — FINAL FROZEN MODEL (review §18, 2026-09-03)
#
# The single reproduction entry point for all future baseline comparisons,
# LP experiments, and paper result tables. Frozen structure:
#
#   P0 M1:  C / Pt / Pv semantic factorization (jointly optimized)
#   P1 M2:  topology-only relation decomposition, K=4
#   P2:     Null-Augmented Factor-Relation Plan (coupler = NullSoftmax)
#   P3:     Full Cell-conditioned Operator (review §15 terminology):
#               T_fk = W0 + A_f + B_k + C_fk   (validation-selected, 5 seeds)
#
# NEVER add experiment knobs here; this config mirrors biaxis_p3.yaml with
# the frozen final operator. Ablation variants live in biaxis_p3.yaml only.
# =========================================================================

hidden_dim: 256
factor_dim: 128
dropout: 0.2
activation: gelu
norm: layernorm

lambda_common: 0.02
lambda_orth: 0.01
lambda_recon: 0.3
orth_fallback_batch: 16

full_graph_training: true

# Unified NC protocol.
lr: 0.001
weight_decay: 0.0001

# --- P1 relation decomposition (frozen, M2) ---
p1:
  factor_aware: true
  num_relations: 4
  relation_dim: 32
  relation_temperature: 0.5
  selector_hidden_dim: 64
  selector_input_norm: null
  budget_hidden_dim: 64
  use_graph_budget: true
  budget_shared: false
  eps: 1.0e-8
  relation_balance_weight: 0.0
  alpha_entropy_weight: 0.0
  budget_reg_weight: 0.0
  edge_chunk_size: 500000

# --- P2 transport coupling: frozen NullSoftmax (plan §2.3/§2.4) ---
p2:
  mode: null_softmax
  score_hidden_dim: 64
  epsilon: 0.2
  tau_base: 1.0
  sinkhorn_iters: 10
  null_prior: 0.5
  null_score_init: 0.0
  deterministic: false
  detach_capacity_prior: true
  detach_relation_confidence: true
  eps: 1.0e-8

# --- P3 final operator: Full Cell-conditioned Operator (OFR) ---
p3:
  operator_mode: full_interaction
  operator_reg_weight: 0.0
  interaction_reg_weight: 0.0
  # Memory fix (2026-09-04, user-authorized): activation checkpointing for
  # the context+scorer segment. Numerics-preserving (recomputation is
  # bitwise identical); training peak on ele-fashion drops ~16.4GB -> ~11GB.
  memory_checkpoint: true
