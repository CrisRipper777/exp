name: biaxis_p2

# --- P0 semantic factorization (arch/obj unchanged, jointly optimized) ---
hidden_dim: 256
factor_dim: 128
dropout: 0.2
activation: gelu
norm: layernorm

lambda_common: 0.02
lambda_orth: 0.01
lambda_recon: 0.3
orth_fallback_batch: 16

full_graph_training: true

# Unified NC protocol.
lr: 0.001
weight_decay: 0.0001

# --- P1 relation decomposition (frozen, M2) ---
p1:
  factor_aware: true
  num_relations: 4
  relation_dim: 32
  relation_temperature: 0.5
  selector_hidden_dim: 64
  selector_input_norm: null
  budget_hidden_dim: 64
  use_graph_budget: true
  budget_shared: false
  eps: 1.0e-8
  relation_balance_weight: 0.0
  alpha_entropy_weight: 0.0
  budget_reg_weight: 0.0
  edge_chunk_size: 500000

# --- P2 transport coupling (plan §19) ---
p2:
  # null_softmax | fixed_uot | adaptive_uot | composition_uot
  # composition_uot = relation-composition-only (review §9/§10): total graph
  # mass comes from the unconstrained NullSoftmax plan (detached), the UOT
  # constraint only redistributes it across R1..RK. No pi0 anywhere.
  mode: adaptive_uot

  score_hidden_dim: 64

  epsilon: 0.2
  tau_base: 1.0
  sinkhorn_iters: 10

  null_prior: 0.5
  null_score_init: 0.0

  # Deterministic verification mode (bitwise-reproducible runs): replaces
  # GPU-atomic aggregation with CSR SpMM / cumsum reductions. Default false
  # (atomics are faster); enable only for reproducibility sweeps.
  deterministic: false

  detach_capacity_prior: true
  detach_relation_confidence: true

  eps: 1.0e-8
