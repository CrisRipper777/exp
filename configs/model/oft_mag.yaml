name: oft_mag

# OFT-MAG O1 scaffold: OFT-DIAG-ID (functional operator = Identity).
# P0 factorizer + fusion reuse: hidden_dim/factor_dim/loss weights identical
# to biaxis_p0.yaml (0.02/0.01/0.3).
hidden_dim: 256
factor_dim: 128
dropout: 0.2
activation: gelu
norm: layernorm

# O1 = diag_id (real graph propagation). O1.5 causal cleanup adds
# diag_nograph: strict matched no-topology control — identical params/init/
# fusion/losses, only the graph neighbor response is forced to zero
# (edge_index routed away -> N=0 -> delta = D(0) = 0 exactly -> H1 = LN(H0)).
# O2-A adds two cross-ownership variants (same DIAG backbone + an additive
# static branch of six zero-init C_{a->b} for a != b):
#   static_cross_dup — capacity-matched control, cross branch reads N^b (target)
#   static_cross     — treatment, cross branch reads N^a (real other ownership)
# O2-B1 adds target-conditioned Null-vs-Transfer routing over those six maps
# (one shared router + factor embeddings; router input is target-only:
# [H^b | N^b | e_a | e_b], never source content):
#   conditional_cross_dup — capacity-matched control, payload reads N^b (target)
#   conditional_cross     — treatment, payload reads N^a (real other ownership)
variant: diag_id
# O1 / O1.5 are single-layer scaffolds by design (no multi-scale). The model
# module raises unless num_layers == 1.
num_layers: 1

# In-model aux loss weights (same P0 recipe as biaxis_p0.yaml).
lambda_common: 0.02
lambda_orth: 0.01
lambda_recon: 0.3

# Below this batch size the cross-covariance orthogonality loss falls back to
# squared-cosine overlap.
orth_fallback_batch: 16

# O1 DIAG-ID needs the full graph for its propagation; never sample.
full_graph_training: true
