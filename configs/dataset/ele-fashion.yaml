name: ele-fashion
source: mmgraph
tasks: [nc]

root: ${paths.data_root}/ele-fashion
joint_feat_path: ${dataset.root}/clip_feat.pt
# MM-Graph precomputed *_feat.pt files are [x_t, x_i]:
# clip=512+512, imagebind=1024+1024, t5dino/t5vit=768+768.
edge_path: ${dataset.root}/nc_edges-nodeid.pt
label_path: ${dataset.root}/labels-w-missing.pt
node_split_path: ${dataset.root}/split.pt
node_mapping_path: ${dataset.root}/node_mapping.pt

num_classes: 12
feature_dtype: float32
text_dim: 512
visual_dim: 512
make_undirected: true
add_self_loops: false
