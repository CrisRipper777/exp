hydra:
  run:
    dir: /hdd1/DataInHere/YHF/exp/experiments/r0/results/Grocery/seed_42/train_probe
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/hdd1/DataInHere/YHF/exp/experiments/r0/results/Grocery/seed_42/train_probe
    - hydra.mode=RUN
    task:
    - dataset=Grocery
    - task=nc
    - model=simple_mag_probe
    - seed=42
    - num_runs=1
    - task.evaluate_test=true
    - task.save_ckpt_path=/hdd1/DataInHere/YHF/exp/experiments/r0/checkpoints/Grocery_seed42_probe.pt
    - task.history_path=/hdd1/DataInHere/YHF/exp/experiments/r0/results/Grocery/seed_42/probe_train_log.csv
    - device=cuda:0
  job:
    name: main
    chdir: false
    override_dirname: dataset=Grocery,device=cuda:0,model=simple_mag_probe,num_runs=1,seed=42,task.evaluate_test=true,task.history_path=/hdd1/DataInHere/YHF/exp/experiments/r0/results/Grocery/seed_42/probe_train_log.csv,task.save_ckpt_path=/hdd1/DataInHere/YHF/exp/experiments/r0/checkpoints/Grocery_seed42_probe.pt,task=nc
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /hdd1/DataInHere/YHF/exp
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /hdd1/DataInHere/YHF/exp/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /hdd1/DataInHere/YHF/exp/experiments/r0/results/Grocery/seed_42/train_probe
    choices:
      model: simple_mag_probe
      task: nc
      dataset: Grocery
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
