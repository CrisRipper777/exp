dataset:
  name: Grocery
  source: magb
  tasks:
  - nc
  - lp
  graph_path: ${paths.data_root}/Grocery/GroceryGraph.pt
  text_feat_path: ${paths.data_root}/Grocery/TextFeature/Grocery_roberta_base_256_mean.npy
  image_feat_path: ${paths.data_root}/Grocery/ImageFeature/Grocery_openai_clip-vit-large-patch14.npy
  num_classes: 20
  feature_dtype: float32
  make_undirected: true
  add_self_loops: false
  nc_split_path: ${paths.split_root}/Grocery_nc_seed${seed}_train0.6_val0.2.pt
  lp_split_path: ${paths.split_root}/Grocery_lp_seed${seed}_val0.2_test0.2_neg150_filtered1.pt
  nc_train_ratio: 0.6
  nc_val_ratio: 0.2
  lp_val_ratio: 0.2
  lp_test_ratio: 0.2
  lp_num_neg: 150
  lp_split_undirected: true
  auto_generate_splits: true
task:
  name: nc
  training_mode: full_graph
  optimizer: adamw
  epochs: 300
  lr: 0.001
  weight_decay: 0.0001
  patience: 30
  early_stop_min_epoch: 1
  grad_clip: null
  batch_size: 1024
  num_neighbors: 15
  inference_mode: full
  inference_batch_size: 4096
  eval_every: 1
  max_train_batches: null
  save_ckpt_path: null
  loss:
    aux_weight: 1.0
  evaluate_test: true
  history_path: null
  scheduler: null
  scheduler_warmup_epochs: 10
  scheduler_min_lr: 1.0e-05
model:
  name: mlp
  hidden_dim: 128
  num_layers: 2
  dropout: 0.5
  activation: relu
  norm: none
  lr: 0.001
  weight_decay: 0.0001
seed: 42
num_runs: 1
device: cuda:1
paths:
  data_root: /hdd1/DataInHere/YHF/data
  split_root: /hdd1/DataInHere/YHF/data/MAGB_split
  output_root: outputs
logging:
  level: INFO
